<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b55"><title>Materia Quest — by BROT2YOU</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#0b1832}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#355ea2 0,transparent 38%),linear-gradient(155deg,#10274e,#09152e 75%)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffe17a;outline-offset:3px}.shell{max-width:1050px;margin:auto;padding:20px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-weight:1000;font-size:clamp(25px,5vw,43px);letter-spacing:.5px;color:#ffe581;text-shadow:0 4px #8e4a31}.brand small{display:block;font-size:12px;color:#c6dfff;text-shadow:none;letter-spacing:2px}.stats{display:flex;gap:9px;flex-wrap:wrap}.pill{background:#ffffff1c;border:1px solid #ffffff3b;padding:9px 12px;border-radius:18px;font-weight:800}.hero{margin:22px 0;padding:25px;border:2px solid #ffffff3b;border-radius:26px;background:linear-gradient(120deg,#3359a3dd,#234a86bb);display:flex;justify-content:space-between;gap:15px;align-items:center;box-shadow:0 15px 35px #0004}.hero h1{margin:0 0 9px;font-size:clamp(23px,4vw,38px)}.hero p{margin:0;color:#d9e8ff;max-width:650px;line-height:1.5}.hero .art{font-size:75px;filter:drop-shadow(0 9px 2px #0003)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab,.btn{border:1px solid #ffffff50;background:#ffffff1b;color:white;border-radius:14px;padding:11px 16px;font-weight:800}.tab.active,.btn.primary{background:#ffcf59;color:#17264a;border-color:#ffea9d}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{background:#ffffff12;border:1px solid #ffffff35;border-radius:22px;padding:19px;box-shadow:0 8px 24px #0002}.card h2{font-size:21px;margin:9px 0}.card p{color:#d7e5ff;line-height:1.5}.emoji{font-size:43px}.card .btn{width:100%;margin-top:8px}.panel{background:#ffffff13;border:1px solid #ffffff38;border-radius:24px;padding:24px;margin:15px 0}.panel h2{margin-top:0}.muted{color:#c5d8f8}.choices{display:grid;gap:11px;margin:20px 0}.choice{width:100%;text-align:left;background:#fff;color:#193257;border:3px solid transparent;padding:15px 17px;border-radius:14px;font-weight:750;min-height:52px}.choice.selected{border-color:#ffcb51}.choice.correct{background:#c8f8db;border-color:#35c87e}.choice.wrong{background:#ffd8d9;border-color:#ee6675}.feedback{padding:15px;border-radius:13px;background:#ffffff1b;margin:15px 0;line-height:1.5}.progress{height:13px;border-radius:30px;background:#ffffff2b;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#5ce8b5,#ffe178);transition:width .25s}.lesson{line-height:1.65}.lesson strong{color:#ffe384}.lesson ul{padding-left:23px}.lesson li{margin:9px 0}.diagram{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:24px 0}.step{background:#fff;color:#1d3d68;padding:15px;border-radius:18px;text-align:center;min-width:125px;flex:1}.step b{display:block;font-size:26px}.arrow{font-size:25px;color:#ffdf77}.footer{text-align:center;color:#aac1e5;font-size:13px;margin-top:32px}.hidden{display:none!important}@media(max-width:550px){.hero{padding:18px}.hero .art{font-size:48px}.panel{padding:17px}.step{min-width:110px}.arrow{font-size:17px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">⚗️ MATERIA QUEST<small>by BROT2YOU</small></div><div class="stats"><span class="pill" id="xp">⭐ 0 XP</span><span class="pill" id="stars">🏆 0 étoiles</span></div></header><section class="hero"><div><h1>Explore les secrets de la matière !</h1><p>Apprends les états de la matière et le cycle de l'eau, puis relève des défis pour devenir un expert scientifique.</p></div><div class="art" aria-hidden="true">🌍💧</div></section><nav class="tabs" aria-label="Navigation"><button class="tab active" data-page="home">🏠 Accueil</button><button class="tab" data-page="lessons">📚 Leçons</button><button class="tab" data-page="games">🎮 Défis</button><button class="tab" data-page="progress">🏅 Progrès</button></nav><div id="view" aria-live="polite"></div><footer class="footer">MATERIA QUEST • Physique-chimie • Fonctionne hors connexion • by BROT2YOU</footer></main><script>
'use strict';const lessons=[{id:'intro',emoji:'🔬',title:'Physique ou chimie ?',short:'Découvre ce qu’étudient les scientifiques.',html:`<p>La <strong>physique</strong> étudie les objets, les mouvements, la lumière, le son et l’énergie.</p><p>La <strong>chimie</strong> étudie la composition, les transformations et les réactions de la matière.</p><p>La physique et la chimie étudient toutes deux <strong>la matière et ses propriétés</strong>.</p>`},{id:'states',emoji:'🧊',title:'Les trois états de la matière',short:'Solide, liquide et gazeux.',html:`<p>Sur Terre, la matière peut se présenter sous trois états :</p><ul><li><strong>Solide :</strong> possède une forme propre et un volume propre. Il est pratiquement incompressible. Exemples : glaçon, bois, pierre.</li><li><strong>Liquide :</strong> possède un volume propre mais prend la forme du récipient. Sa surface libre au repos est plane et horizontale. Il est très peu compressible. Exemples : eau, huile, jus de fruits.</li><li><strong>Gaz :</strong> n’a ni forme propre ni volume propre : il occupe tout l’espace disponible. Il est compressible et expansible. Exemples : air, vapeur d’eau, dioxyde de carbone.</li></ul><p><strong>Attention :</strong> la vapeur d’eau est invisible. Le brouillard et les nuages sont constitués de minuscules gouttelettes d’eau et parfois de cristaux de glace.</p>`},{id:'water',emoji:'🌦️',title:'Le cycle de l’eau',short:'Suis le voyage d’une goutte d’eau.',html:`<p>Grâce à l’énergie du Soleil, l’eau des mers, des lacs et des sols <strong>s’évapore</strong> : elle passe de l’état liquide à l’état gazeux.</p><p>En altitude, l’air se refroidit. La vapeur d’eau peut se <strong>condenser</strong> en gouttelettes : des nuages se forment.</p><p>L’eau retombe en <strong>précipitations</strong> (pluie ou neige). Elle peut ensuite <strong>ruisseler</strong> vers les rivières, <strong>s’infiltrer</strong> dans les sols et alimenter les nappes souterraines.</p><p>Les plantes rejettent aussi de la vapeur d’eau : c’est une partie de l’<strong>évapotranspiration</strong>.</p><div class="diagram"><div class="step"><b>☀️🌊</b>Évaporation</div><span class="arrow">➜</span><div class="step"><b>☁️</b>Condensation</div><span class="arrow">➜</span><div class="step"><b>🌧️</b>Précipitations</div><span class="arrow">➜</span><div class="step"><b>🏞️</b>Retour de l’eau</div></div>`},{id:'changes',emoji:'🌡️',title:'Les changements d’état',short:'Fusion, solidification, évaporation…',html:`<ul><li><strong>Fusion :</strong> solide → liquide (la glace fond).</li><li><strong>Solidification :</strong> liquide → solide (l’eau gèle).</li><li><strong>Vaporisation :</strong> liquide → gaz (évaporation ou ébullition).</li><li><strong>Liquéfaction (condensation liquide) :</strong> gaz → liquide (formation de gouttelettes).</li></ul><p>Un changement d’état ne crée pas une nouvelle substance : l’eau reste de l’eau.</p>`}];
const questions=[{q:'Que décrit principalement la chimie ?',a:['Les mouvements des planètes','Les transformations et réactions de la matière','La propagation du son'],c:1,e:'La chimie s’intéresse à la composition et aux transformations de la matière.',cat:'intro'},{q:'Quel domaine étudie la lumière et le son ?',a:['La physique','La géographie','La grammaire'],c:0,e:'La physique étudie notamment la lumière, le son et l’énergie.',cat:'intro'},{q:'Quel état possède une forme propre ?',a:['Liquide','Gaz','Solide'],c:2,e:'Un solide conserve sa forme sans avoir besoin d’un récipient.',cat:'states'},{q:'Quel état prend la forme de son récipient tout en gardant son volume ?',a:['Liquide','Solide','Gaz'],c:0,e:'Le liquide s’adapte à la forme du récipient et conserve son volume.',cat:'states'},{q:'Un gaz placé dans une bouteille fermée…',a:['Garde une forme propre','Occupe tout l’espace disponible','Ne peut jamais être comprimé'],c:1,e:'Un gaz est expansible et compressible.',cat:'states'},{q:'La vapeur d’eau est-elle visible ?',a:['Oui, elle est blanche','Non, elle est invisible','Oui, elle est bleue'],c:1,e:'Les nuages visibles sont faits de gouttelettes ou de cristaux de glace, pas de vapeur visible.',cat:'states'},{q:'À quoi ressemble la surface libre d’un liquide au repos ?',a:['Toujours bombée','Plane et horizontale','Toujours verticale'],c:1,e:'Au repos, la surface libre d’un liquide est plane et horizontale.',cat:'states'},{q:'Le passage de la glace à l’eau liquide est…',a:['La fusion','La condensation','La solidification'],c:0,e:'La fusion est le passage de l’état solide à l’état liquide.',cat:'changes'},{q:'Quand l’eau liquide devient glace, c’est…',a:['La vaporisation','La solidification','La fusion'],c:1,e:'La solidification est le passage de l’état liquide à l’état solide.',cat:'changes'},{q:'Quel changement fait passer un liquide à l’état gazeux ?',a:['La fusion','La solidification','La vaporisation'],c:2,e:'La vaporisation comprend notamment l’évaporation.',cat:'changes'},{q:'Quand la vapeur d’eau forme des gouttelettes, il y a…',a:['Liquéfaction','Fusion','Solidification'],c:0,e:'La vapeur d’eau redevient liquide : c’est la liquéfaction, souvent appelée condensation.',cat:'changes'},{q:'Quelle source d’énergie favorise l’évaporation dans le cycle de l’eau ?',a:['Le Soleil','La Lune','Les roches'],c:0,e:'L’énergie solaire favorise l’évaporation de l’eau.',cat:'water'},{q:'Pourquoi des nuages se forment-ils en altitude ?',a:['L’eau disparaît','La vapeur d’eau se refroidit et se condense','Les océans gèlent tous'],c:1,e:'En se refroidissant, la vapeur d’eau peut former des gouttelettes ou des cristaux de glace.',cat:'water'},{q:'Comment appelle-t-on l’eau qui pénètre dans le sol ?',a:['Ruissellement','Infiltration','Ébullition'],c:1,e:'L’infiltration permet à l’eau de rejoindre les sols et parfois les nappes souterraines.',cat:'water'},{q:'Comment appelle-t-on l’eau qui s’écoule à la surface du sol ?',a:['Ruissellement','Condensation','Fusion'],c:0,e:'Le ruissellement peut conduire l’eau vers les ruisseaux et rivières.',cat:'water'},{q:'Les plantes participent au cycle de l’eau grâce à…',a:['La solidification','L’évapotranspiration','La fusion'],c:1,e:'Les plantes libèrent de la vapeur d’eau par transpiration.',cat:'water'},{q:'Quelles sont des précipitations ?',a:['Pluie et neige','Vent et lumière','Roches et sable'],c:0,e:'La pluie et la neige sont deux formes de précipitations.',cat:'water'},{q:'Où peut aller l’eau après son infiltration ?',a:['Dans les nappes souterraines','Uniquement dans les nuages','Elle cesse d’exister'],c:0,e:'L’eau infiltrée peut alimenter les réserves d’eau souterraines.',cat:'water'}];
const key='materia-quest-v1';let saved={xp:0,stars:0,best:0,done:[]};try{const v=JSON.parse(localStorage.getItem(key));if(v&&typeof v==='object')saved={...saved,...v}}catch{}let page='home',lessonId='intro',mode='all',round=[],idx=0,chosen=null,checked=false,correct=0;const $=s=>document.querySelector(s),view=$('#view');function persist(){try{localStorage.setItem(key,JSON.stringify(saved))}catch{}$('#xp').textContent='⭐ '+saved.xp+' XP';$('#stars').textContent='🏆 '+saved.stars+' étoiles'}function nav(p){page=p;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>nav(t.dataset.page)));function render(){if(page==='home')home();if(page==='lessons')lessonList();if(page==='lesson')lessonView();if(page==='games')games();if(page==='quiz')quiz();if(page==='results')results();if(page==='progress')progress()}function home(){view.innerHTML=`<div class="grid"><article class="card"><div class="emoji">📚</div><h2>Apprendre</h2><p>4 leçons courtes et claires, directement issues du cahier.</p><button class="btn primary" id="learn">Ouvrir les leçons</button></article><article class="card"><div class="emoji">🎮</div><h2>S’entraîner</h2><p>18 questions avec corrections et explications. Défis par thème ou grand défi.</p><button class="btn primary" id="play">Jouer maintenant</button></article><article class="card"><div class="emoji">🏅</div><h2>Mes progrès</h2><p>Retrouve tes étoiles, ton record et les leçons étudiées.</p><button class="btn primary" id="see">Voir mes progrès</button></article></div>`;$('#learn').onclick=()=>nav('lessons');$('#play').onclick=()=>nav('games');$('#see').onclick=()=>nav('progress')}function lessonList(){view.innerHTML='<h2>📚 Les leçons</h2><div class="grid">'+lessons.map(l=>`<article class="card"><div class="emoji">${l.emoji}</div><h2>${l.title} ${saved.done.includes(l.id)?'✅':''}</h2><p>${l.short}</p><button class="btn primary" data-id="${l.id}">Étudier</button></article>`).join('')+'</div>';view.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{lessonId=b.dataset.id;page='lesson';render()})}function lessonView(){const l=lessons.find(x=>x.id===lessonId);view.innerHTML=`<button class="btn" id="back">← Toutes les leçons</button><section class="panel lesson"><div class="emoji">${l.emoji}</div><h2>${l.title}</h2>${l.html}<button class="btn primary" id="complete">${saved.done.includes(l.id)?'✅ Leçon déjà étudiée':'J’ai compris ! +20 XP'}</button><button class="btn" id="practice">🎯 M’entraîner sur ce thème</button></section>`;$('#back').onclick=()=>nav('lessons');$('#complete').onclick=()=>{if(!saved.done.includes(l.id)){saved.done.push(l.id);saved.xp+=20;persist()}lessonView()};$('#practice').onclick=()=>start(l.id)}function games(){view.innerHTML='<h2>🎮 Choisis ton défi</h2><div class="grid">'+[{id:'all',emoji:'🏆',title:'Grand défi',desc:'18 questions mélangées sur tout le chapitre.'},...lessons.map(l=>({id:l.id,emoji:l.emoji,title:l.title,desc:'Questions ciblées sur ce thème.'}))].map(g=>`<article class="card"><div class="emoji">${g.emoji}</div><h2>${g.title}</h2><p>${g.desc}</p><button class="btn primary" data-game="${g.id}">Commencer ▶</button></article>`).join('')+'</div>';view.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game))}function start(m){mode=m;round=questions.filter(q=>m==='all'||q.cat===m).map(q=>({...q}));for(let i=round.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[round[i],round[j]]=[round[j],round[i]]}idx=0;correct=0;chosen=null;checked=false;page='quiz';render()}function quiz(){const q=round[idx];view.innerHTML=`<div class="panel"><div class="top"><strong>Question ${idx+1} / ${round.length}</strong><span class="pill">🎯 ${correct} bonne(s) réponse(s)</span></div><div class="progress" style="margin:15px 0"><span style="width:${100*idx/round.length}%"></span></div><h2>${q.q}</h2><div class="choices">${q.a.map((a,i)=>`<button class="choice ${checked?(i===q.c?'correct':i===chosen?'wrong':''):i===chosen?'selected':''}" data-answer="${i}" ${checked?'disabled':''}>${['A','B','C'][i]}. ${a}</button>`).join('')}</div><div id="feed">${checked?`<div class="feedback"><strong>${chosen===q.c?'✅ Bonne réponse !':'💡 À retenir'}</strong><p>${q.e}</p></div>`:''}</div><button class="btn primary" id="next" ${chosen===null?'disabled':''}>${checked?(idx===round.length-1?'Voir mes résultats 🏆':'Question suivante →'):'Valider ma réponse'}</button><button class="btn" id="quit">Quitter</button></div>`;view.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.answer);quiz()});$('#quit').onclick=()=>nav('games');$('#next').onclick=()=>{if(!checked){checked=true;if(chosen===q.c)correct++;quiz()}else if(idx===round.length-1){const gained=correct*10; saved.xp+=gained;const stars=Math.round(3*correct/round.length);saved.stars+=stars;if(mode==='all')saved.best=Math.max(saved.best,correct);persist();page='results';render()}else{idx++;chosen=null;checked=false;quiz()}}}function results(){const stars=Math.round(3*correct/round.length);view.innerHTML=`<section class="panel" style="text-align:center"><div style="font-size:70px">${correct/round.length>=.8?'🏆':'🌟'}</div><h2>Défi terminé !</h2><h1>${correct} / ${round.length}</h1><p>Tu as gagné <strong>${correct*10} XP</strong> et <strong>${stars} étoile(s)</strong> !</p><p class="muted">${correct===round.length?'Sans faute !':correct/round.length>=.7?'Bravo ! Continue comme ça.':'Tu progresses : relis les leçons et réessaie.'}</p><button class="btn primary" id="again">Rejouer</button><button class="btn" id="back">Autres défis</button></section>`;$('#again').onclick=()=>start(mode);$('#back').onclick=()=>nav('games')}function progress(){view.innerHTML=`<section class="panel"><h2>🏅 Mon carnet d’explorateur</h2><div class="grid"><div class="card"><div class="emoji">⭐</div><h2>${saved.xp} XP</h2><p>Points gagnés</p></div><div class="card"><div class="emoji">🏆</div><h2>${saved.stars}</h2><p>Étoiles récoltées</p></div><div class="card"><div class="emoji">📚</div><h2>${saved.done.length} / ${lessons.length}</h2><p>Leçons étudiées</p></div><div class="card"><div class="emoji">🎯</div><h2>${saved.best} / 18</h2><p>Record du grand défi</p></div></div><p class="muted">La progression est enregistrée sur cet appareil.</p><button class="btn" id="reset">Réinitialiser ma progression</button></section>`;$('#reset').onclick=()=>{if(confirm('Effacer tous les points, étoiles et leçons terminées ?')){saved={xp:0,stars:0,best:0,done:[]};persist();progress()}}}persist();render();
</script></body></html>
